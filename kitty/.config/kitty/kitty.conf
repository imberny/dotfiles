# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_size 12.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 5

# No stupid close confirmation
confirm_os_window_close 0

# Allow remote control to allow for dynamically setting background color
allow_remote_control password
remote_control_password "nvim-set-color-passwd" get-colors set-colors

# Remove beep
window_alert_on_bell no

copy_on_select yes

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Term SS03"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Window appearance
active_border_color #00ff00

# Tab appearance
active_tab_font_style bold
tab_bar_style separator
# tab_separator " ┇"
tab_separator ""
tab_title_template "┇ {fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title} ┇"
tab_bar_align center

